experiment:
  name: avid_v1_full_benchmark
  seed: 777
  timeout_seconds: 600
  rounds_per_scenario: 8192
  window_rounds: 256

software:
  emulator: qemu
  architecture: aarch64
  boot_mode: linux
  daemon: avid_daemon
  hal_backend: simulation_backend

rtl:
  simulator: verilator
  top_module: aa_qec_top
  clock_period_ns: 4
  reset_cycles: 10
  bp_iterations: [1, 2, 3, 4, 5]
  waveform: false

bridge:
  transport: unix_socket
  protocol_version: 1
  clock_mode: deterministic
  transaction_timeout_ms: 5000

scenarios:
  - stationary_noise
  - slowly_drifting_noise
  - correlated_noise
  - burst_disturbance
  - delayed_weight_commit
  - reset_recovery
  - busy_decoder

validation:
  assertions: true
  fail_on_rtl_error: true
  fail_on_timeout: true

artifacts:
  output_dir: runs
  save_logs: true
  save_waveforms: false
  save_transactions: true
  save_metrics: true
