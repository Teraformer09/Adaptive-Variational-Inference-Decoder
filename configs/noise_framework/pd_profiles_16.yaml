# 16 Canonical Probability Distribution (PD) Profiles (PD_01 .. PD_16)
# Single source of truth for the 16 reusable probability distributions.
# Each profile defines a truncated Gaussian distribution N_trunc(mean, std^2; [min, max])
# over a physical fault-probability random variable, together with explicit temporal envelope
# and spatial/mechanism metadata so data-fault and measurement-noise generators can sample
# from any assigned profile without inventing ad-hoc distributions.

schema_version: "1.0"
num_profiles: 16

profiles:
  - profile_id: "PD_01"
    distribution_type: "truncated_gaussian"
    parameters:
      mean: 0.0030
      std: 0.0008
      temporal_mu_sec: 12.0
      temporal_sigma_sec: 4.5
      burst_amplitude: 0.012
      sticky_scale: 0.04
      dropout_scale: 0.0005
      delay_quantiles: [0.92, 0.99]
    support:
      min: 0.0002
      max: 0.0250
      variable: "fault_probability"
      units: "probability_per_sample"
    metadata:
      category: "early_disturbance"
      description: "Low-intensity narrow early probability profile"
      dominant_qubits: [0, 1, 4]
      dominant_pairs: [0, 4]

