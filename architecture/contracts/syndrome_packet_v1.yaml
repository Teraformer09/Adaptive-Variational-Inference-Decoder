# A05 / Q11 / SF1 — Canonical Syndrome Packet & Binary Framing Contract (Authoritative A1 Resolution)
schema_version: "1.1.0"
contract_id: "syndrome_packet_v1"

# Authoritative Layer 1 -> Layer 3 DMA / stimulus binary stream framing:
# Contiguous little-endian 8-byte (uint64_t) A05/Q11 packet words (no 16B header prefix).
stream_framing:
  packet_size_bytes: 8
  endianness: "little"
  require_non_empty: true
  byte_length_multiple_of: 8
  cross_layer_producer: "simulation/stimulus/packet_codec.py"
  cross_layer_consumer: "software/src/ingress/packet_validator.h"

per_round_packet_u64:
  packet_size_bytes: 8                  # 64-bit little-endian DMA / stimulus word per syndrome round
  unpacked_c_struct_bytes: 12           # sizeof(avid_syndrome_packet_t) on LP64/ILP32
  endianness: "little"
  bit_layout:
    s_x_bits:                           # Independent X-stabilizer syndrome bits (detect Z data errors)
      lsb: 0
      msb: 3
      width: 4
      source: "s_X = H_X * e_Z mod 2"
    s_z_bits:                           # Independent Z-stabilizer syndrome bits (detect X data errors)
      lsb: 4
      msb: 7
      width: 4
      source: "s_Z = H_Z * e_X mod 2"
    flags:                              # Bits [15:8]: status & integrity flags
      lsb: 8
      msb: 15
      width: 8
      valid_bit: 0                      # 0x01 = AVID_PKT_FLAG_VALID (must be 1)
      overflow_bit: 1                   # 0x02 = AVID_PKT_FLAG_OVERFLOW
      parity_err_bit: 2                 # 0x04 = AVID_PKT_FLAG_PARITY_ERR (must be 0)
      epoch_mark_bit: 3                 # 0x08 = AVID_PKT_FLAG_EPOCH_MARK
      reserved_mask: 0xF0               # Bits [7:4] of flags ([15:12] of word) MUST be zero
    epoch_id:                           # Bits [31:16]: monotonic non-decreasing weight-bank epoch ID
      lsb: 16
      msb: 31
      width: 16
    seq_id:                             # Bits [63:32]: 32-bit monotonic 1 MHz round sequence/timestamp ID
      lsb: 32
      msb: 63
      width: 32

axis_fpga_word_d3:
  width_bits: 16                        # Fast-path RTL slice fed to axis_syndrome_rx s_axis_tdata[15:0]
  s_x_slice: "[3:0]"
  s_z_slice: "[7:4]"
  valid_bit: "[8]"

invariants:
  - "s_X and s_Z MUST be generated and packed independently from H_X and H_Z; never copy one array into both."
  - "avid_pack_packet_u64_checked() rejects s_x > 15, s_z > 15, or non-zero reserved flag bits (flags & 0xF0)."
  - "Stream byte length MUST satisfy len > 0 and (len % 8) == 0; truncated or trailing bytes are rejected."
  - "Rejected packets MUST NOT overwrite caller output structs, advance last_seq_id, or regress last_epoch_id."
  - "Any sequence gap or duplicate (seq_id[t] != (seq_id[t-1] + 1) mod 2^32) or epoch regression (epoch_id[t] < epoch_id[t-1]) is rejected and counted."
