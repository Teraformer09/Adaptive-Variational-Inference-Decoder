# A09 / Q18–Q19 — Deterministic Fault Containment & Fallback Policy Contract
schema_version: "1.1.0"
contract_id: "fault_policy_v1"

states:
  - "NOMINAL_ADAPTIVE"                  # Normal operation: ARM commits validated LLR updates
  - "HOLD_LAST_GOOD_EPOCH"              # Transient fault: retain last committed active LLR bank, skip commit
  - "STATIC_DEFAULT_FALLBACK"           # Persistent fault (>=3 consecutive failures): revert shadow/active to calibrated static prior LLRs
  - "DEGRADED_BYPASS"                   # Hardware bus / MMIO write failure: latch bypass protection

triggers:
  - trigger_id: "F01_PACKET_FRAMING_OR_FLAGS_INVALID"
    condition: "stream byte_len == 0 or (byte_len % 8) != 0, VALID flag == 0, PARITY_ERR flag != 0, or reserved flag bits [7:4] != 0"
    transition: "NOMINAL_ADAPTIVE -> HOLD_LAST_GOOD_EPOCH"
    action: "Reject malformed packet/stream without mutating validator state or output struct; increment invalid_flag_count."

  - trigger_id: "F02_SEQUENCE_GAP_DUPLICATE_OR_EPOCH_REGRESS"
    condition: "seq_id[t] != (seq_id[t-1] + 1) mod 2^32 or epoch_id[t] < epoch_id[t-1]"
    transition: "NOMINAL_ADAPTIVE -> HOLD_LAST_GOOD_EPOCH"
    action: "Increment seq_gap_count / seq_dup_count / epoch_regress_count without advancing last_seq_id; require W_min >= 16 valid samples before estimator fit."

  - trigger_id: "F03_RING_BUFFER_OVERWRITE_STALE_WINDOW"
    condition: "DMA ingress slot full or oversized burst (> 64 packets)"
    transition: "NOMINAL_ADAPTIVE -> HOLD_LAST_GOOD_EPOCH"
    action: "Reject burst and record exact dropped packet count in overflow_drops."

  - trigger_id: "F04_ESTIMATOR_NON_CONVERGENCE_OR_NAN"
    condition: "Total samples < 16, non-finite/out-of-bounds theta or prior, or L-BFGS non-convergence"
    transition: "NOMINAL_ADAPTIVE -> HOLD_LAST_GOOD_EPOCH"
    action: "Abort solver fit with converged=false, preserve model parameters, do NOT write shadow bank or assert COMMIT."

  - trigger_id: "F05_LLR_OUT_OF_RANGE"
    condition: "Any proposed q78 LLR outside [26, 3072] or non-finite probability"
    transition: "NOMINAL_ADAPTIVE -> HOLD_LAST_GOOD_EPOCH"
    action: "Reject quantization bank update; retain active bank."

  - trigger_id: "F06_ARM_DEADLINE_OVERRUN"
    condition: "Adaptation cycle wall time > target_period_us (10,000 us)"
    transition: "NOMINAL_ADAPTIVE -> HOLD_LAST_GOOD_EPOCH"
    action: "Coalesce/drop stale pending window; never stall FPGA fast-path decoder."

  - trigger_id: "F07_PERSISTENT_ADAPTATION_FAILURE"
    condition: "consecutive_holds >= 3"
    transition: "HOLD_LAST_GOOD_EPOCH -> STATIC_DEFAULT_FALLBACK"
    action: "Inject calibrated static p0=0.012 weights into shadow bank and commit safe static prior."

recovery_policy:
  from_hold_to_nominal: "1 valid contiguous window with finite convergent L-BFGS fit within deadline"
  from_static_fallback_to_nominal: "1 valid contiguous window with convergent L-BFGS fit within deadline and bus_ok"
  safety_disclaimer: "Retaining the last-known-good or static calibrated LLR epoch guarantees deterministic decoder execution without mid-decode corruption; it does NOT claim a universal mathematical bound that LER is never worse than static BP under arbitrary adversarial drift."
