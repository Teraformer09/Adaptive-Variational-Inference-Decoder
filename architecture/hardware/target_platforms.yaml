schema_version: 1
platforms:
  v1_primary_emulation_target:
    id: zynq7020_cortex_a9_emulation
    role: "Canonical V1 Dual-Emulator Target (Implemented & Verified)"
    soc_family: "Xilinx Zynq-7000 All Programmable SoC"
    fpga_part: "xc7z020clg484-1"
    ps_cpu_architecture: "ARMv7-A (32-bit)"
    ps_cpu_core: "Dual-core ARM Cortex-A9 @ 667 MHz (NEON + VFPv3)"
    cross_compiler: "arm-linux-gnueabihf-g++ -mcpu=cortex-a9 -mfpu=neon -mfloat-abi=hard"
    cpu_emulator: "qemu-arm -cpu cortex-a9"
    rtl_simulator: "Verilator 5.020 (verilator_c++_rtl)"
    pl_clock_mhz: 250.0
    pl_clock_period_ns: 4.0
    ocm_sram_kb: 256
    l2_cache_kb: 512

  v1_secondary_compatibility_target:
    id: arm64_linux_gnu_compatibility
    role: "Secondary 64-bit ARM Compatibility Build for V2 Transition"
    ps_cpu_architecture: "ARMv8-A (aarch64)"
    cross_compiler: "aarch64-linux-gnu-g++"
    cpu_emulator: "qemu-aarch64-static"

  v2_intended_physical_target:
    id: zynq_ultrascale_plus_zcu104_k26
    role: "Intended V2 Physical FPGA Board Deployment Target (Planned Hardware Scope)"
    soc_family: "Xilinx Zynq UltraScale+ MPSoC"
    boards:
      - "Xilinx ZCU104 (xczu7ev-ffvc1156-2-e)"
      - "Xilinx Kria K26 SOM (xck26-sfvc784-2lv-c)"
    ps_cpu_architecture: "ARMv8-A (64-bit)"
    ps_cpu_core: "Quad-core ARM Cortex-A53 @ 1.2 GHz"
    pl_clock_mhz: 250.0
